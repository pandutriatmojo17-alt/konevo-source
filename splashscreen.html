<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konevo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: linear-gradient(145deg, #071126, #151039, #080d20);
      color: white;
      font-family: Arial, sans-serif;
    }
    .waves {
      width: 180px;
      height: 180px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 2px solid #536dfe;
      border-radius: 50%;
      box-shadow: 0 0 35px #5145ff66;
      animation: pulse 2s infinite ease-in-out;
    }
    .logo {
      font-size: 32px;
      font-weight: bold;
      color: #72d8ff;
      letter-spacing: 2px;
      text-shadow: 0 0 18px #655bff;
    }
    .tagline {
      margin-top: 28px;
      font-size: 14px;
      color: #c9c9e8;
      letter-spacing: 3px;
    }
    .creator {
      position: absolute;
      bottom: 28px;
      font-size: 12px;
      color: #999bbd;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.95); }
      50% { transform: scale(1.05); }
    }
    @media (prefers-reduced-motion: reduce) {
      .waves { animation: none; }
    }
  </style>
</head>
<body>
  <div class="waves">
    <div class="logo">KONEVO</div>
  </div>
  <div class="tagline">CONNECT YOUR WORLD</div>
  <div class="creator">Created by Pandu Triat Mojo</div>
</body>
</html>

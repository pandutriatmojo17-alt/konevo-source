<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konevo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }
    header {
      padding: 22px 20px;
      background: #153e75;
      color: white;
      font-size: 1.35rem;
      font-weight: 700;
    }
    main {
      max-width: 720px;
      margin: 48px auto;
      padding: 0 20px;
      text-align: center;
    }
    .card {
      padding: 36px 24px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 28px rgba(20, 40, 80, 0.08);
    }
    h1 { margin-top: 0; font-size: 2rem; }
    p { color: #536078; line-height: 1.6; }
    .button {
      display: inline-block;
      margin-top: 14px;
      padding: 12px 22px;
      border-radius: 10px;
      background: #1769e0;
      color: white;
      text-decoration: none;
      font-weight: 700;
    }
    footer {
      padding: 24px;
      text-align: center;
      color: #68758a;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>Konevo</header>
  <main>
    <section class="card">
      <h1>Selamat datang di Konevo</h1>
      <p>Ini adalah halaman utama awal Konevo. Tampilan dan fitur aplikasi bisa kita kembangkan lagi setelah halaman ini berhasil dipasang.</p>
      <a class="button" href="#" onclick="alert('Fitur Konevo akan segera hadir!'); return false;">Mulai</a>
    </section>
  </main>
  <footer>© 2026 Konevo</footer>
</body>
</html>
